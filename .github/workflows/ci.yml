# Quality gate — the audit's H1 finding: until this existed, typecheck,
# lint, and the 363-test suite ran only via the local pre-commit hook
# (trivially skipped with --no-verify); the only automated check was
# Vercel's `next build`. Tests need no secrets: the suite is pure/mocked
# and lib/env.ts defaults every var, so no DATABASE_URL here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads pnpm version from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm audit --prod --audit-level=high
      # Coverage thresholds live in vitest.config.ts (TEST-12); the HTML
      # report is kept for a week so a regression can be inspected.
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      # lib/env.ts defaults every var, so the production build needs no
      # secrets here — this catches build breakage before Vercel does.
      - run: pnpm build

  # Read-only smoke tests against the production server in sample-data
  # mode (no DATABASE_URL / Supabase vars → lib/env.ts defaults + the
  # in-repo sample catalog). Playwright builds and starts the app itself
  # via webServer in playwright.config.ts.
  e2e:
    # A red unit/lint/build job must fail the pipeline fast instead of
    # spending another runner on browser smoke (2026-09 engineering audit
    # TEST-01).
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Database-backed end-to-end (2026-09 engineering audit TEST-09): a
  # throwaway Postgres is migrated from db/migrations and seeded with the
  # sample catalog, then Playwright books through the real server action
  # and signs in to the DB-backed admin. No Supabase, no gateway, no
  # notification keys — every provider degrades to its no-op path.
  e2e-db:
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gharmish
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gharmish
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/gharmish
      E2E_DB: '1'
      ADMIN_PHONES: '+966541104000'
      SEED_ALLOW_DESTRUCTIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e e2e/db
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-db
          path: playwright-report/
          retention-days: 7
